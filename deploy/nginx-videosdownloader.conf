# ------------------------------------------------------------------
# nginx site config for https://videosdownloader.online
# Canonical host:   https://videosdownloader.online  (apex, no "www")
#
# This is the edge config that must live on the EC2 proxy host
# (/etc/nginx/sites-available/video-downloader). It is the single
# place the canonical-host redirect belongs: the app and DNS do not
# need any change.
#
# Behaviours enforced:
#   http://videosdownloader.online/        -> 301 https://videosdownloader.online/
#   http://www.videosdownloader.online/    -> 301 https://videosdownloader.online/
#   https://www.videosdownloader.online/   -> 301 https://videosdownloader.online/
#   https://videosdownloader.online/       -> 200 (proxied to the Next.js app)
#
# $request_uri preserves the full path AND query string on every redirect,
# and the canonical host never matches any redirect block, so no loops.
# `return` (not rewrite) is used throughout for edge redirects.
#
# TLS paths below assume the existing Certbot-managed SAN certificate
# (CN=videosdownloader.online with SAN www.videosdownloader.online).
# Adjust the ssl_certificate / ssl_certificate_key paths if your setup
# differs, and keep them identical in the two 443 blocks.
# ------------------------------------------------------------------

# HTTP -> HTTPS, straight to the canonical apex host (single hop).
server {
    listen 80;
    listen [::]:80;
    server_name videosdownloader.online www.videosdownloader.online;
    return 301 https://videosdownloader.online$request_uri;
}

# HTTPS canonical host (apex). Serves the Next.js app.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name videosdownloader.online;

    ssl_certificate /etc/letsencrypt/live/videosdownloader.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videosdownloader.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client uploads can be large (job polling bodies are small; keep sane limits)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;      # long downloads stream through here
    }
}

# HTTPS "www" -> canonical apex 301 (same SAN certificate serves both names).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.videosdownloader.online;

    ssl_certificate /etc/letsencrypt/live/videosdownloader.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videosdownloader.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://videosdownloader.online$request_uri;
}